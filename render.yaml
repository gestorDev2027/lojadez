# Blueprint do Render: um serviço web (Docker). O banco é o Postgres do Supabase (DATABASE_URL, Session pooler).
# Só o DATABASE_URL fica aqui: o resto (Loggi, InfinitePay, remetente...) muda em /vendedor → Configurações, e as
# chaves ficam no Vault do Supabase. O primeiro acesso ao /vendedor usa o código que aparece nos Logs ao ligar.
services:
  - type: web
    name: loja-laminas
    runtime: docker
    plan: starter # o plano free dorme sem acesso: o webhook da InfinitePay pode chegar com o site dormindo
    region: virginia
    healthCheckPath: /api/loja
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase: Connect > Session pooler (porta 5432), com a senha do banco
      - key: LOJA_ADMIN_EMAIL
        sync: false # opcional: o acesso ao /vendedor (sem ele, o primeiro acesso usa o código dos Logs)
      - key: LOJA_ADMIN_SENHA
        sync: false # opcional: pelo menos 10 caracteres; a senha desse acesso só muda aqui
